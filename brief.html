<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2b7d94">
<title>Studio Strong — Morning Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --teal:#2b7d94; --teal-strong:#1f6376; --teal-dim:rgba(43,125,148,.10);
    --bg:#f7f9fc; --surface:#fff; --surface2:#f0f4f8; --line:rgba(0,0,0,.09); --line2:rgba(0,0,0,.18);
    --text:#1a1a1a; --dim:#5a5a5a; --faint:#9a9a9a; --done:#1a8a62; --warn:#b4532a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0e0f10; --surface:#16181a; --surface2:#1d2023; --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.18);
      --text:#e8e8e8; --dim:#9a9a9a; --faint:#666; --teal:#3a9ab5; --teal-strong:#56b3cc; --teal-dim:rgba(58,154,181,.14);
      --done:#2fb383; --warn:#e8845a;
    }
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html { -webkit-text-size-adjust:100%; }
  body {
    background:var(--bg); color:var(--text); font-family:'DM Sans',system-ui,-apple-system,sans-serif;
    font-size:16px; line-height:1.45; min-height:100vh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .wrap { max-width:680px; margin:0 auto; padding:18px 18px 120px; }

  /* Header */
  .top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:6px; }
  .datenav { display:flex; gap:6px; }
  .datenav button, .datenav a {
    font:inherit; font-size:13px; color:var(--dim); background:transparent; border:1px solid var(--line2);
    border-radius:8px; padding:6px 10px; cursor:pointer; text-decoration:none;
  }
  .datenav button:hover { color:var(--teal); border-color:var(--teal); }
  h1 { font-size:26px; font-weight:700; letter-spacing:-.01em; line-height:1.15; }
  .headline { color:var(--dim); margin:8px 0 4px; max-width:60ch; }
  .progress { font-size:13px; color:var(--faint); margin-bottom:18px; }
  .progress b { color:var(--done); font-weight:600; }

  h2 { font-size:15px; font-weight:600; color:var(--teal); margin:26px 0 8px; }
  .fitcard { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:14px 14px 12px; margin-bottom:8px; }
  .fitrow { padding:9px 0; border-bottom:1px solid var(--line); }
  .fitrow:last-of-type { border-bottom:0; }
  .fitrow input { font:inherit; font-size:14px; color:var(--text); background:var(--surface2); border:1px solid var(--line2); border-radius:8px; padding:8px 8px; width:100%; box-sizing:border-box; }
  .fit-ex { font-weight:500; font-size:15px !important; }
  .fit-sub { display:grid; grid-template-columns:1fr 1.2fr 1.3fr; gap:6px; margin-top:6px; }
  .fit-sub input { min-width:0; text-overflow:ellipsis; }
  .fit-foot { display:flex; align-items:center; justify-content:space-between; margin-top:10px; gap:10px; }
  .fit-saved { font-size:12px; color:var(--faint); }
  .fit-goal { font-size:12px; font-weight:600; color:var(--done); }
  .fit-note { font-size:13px; color:var(--dim); background:var(--teal-dim); border-radius:8px; padding:8px 10px; margin-bottom:10px; }
  .fitcard > summary { list-style:none; cursor:pointer; display:flex; align-items:center; justify-content:space-between; padding:2px 0; font-size:14px; color:var(--dim); }
  .fitcard > summary::-webkit-details-marker { display:none; }
  .fitcard > summary .chev { display:inline-block; transition:transform .15s; color:var(--faint); margin-right:4px; }
  .fitcard[open] > summary .chev { transform:rotate(90deg); }
  .fitcard > summary .fit-saved { margin-left:auto; margin-right:10px; }
  .fitbody { margin-top:10px; }
  h3 { font-size:14px; font-weight:600; margin:16px 0 4px; }

  /* Schedule */
  .sched { display:grid; grid-template-columns:auto 1fr; gap:4px 16px; font-size:15px; }
  .sched .t { color:var(--dim); white-space:nowrap; font-variant-numeric:tabular-nums; }
  .sched .loc { color:var(--faint); }
  .muted { color:var(--faint); font-size:14px; }

  /* Items — mirrors the paper: box, number, text */
  .item { border-bottom:1px solid var(--line); }
  .row { display:grid; grid-template-columns:44px 1fr auto; align-items:start; padding:10px 0; }
  .check {
    width:44px; height:44px; margin:-10px 0 -10px -10px; display:flex; align-items:center; justify-content:center;
    background:none; border:0; cursor:pointer; -webkit-tap-highlight-color:transparent;
  }
  .box {
    width:22px; height:22px; border:2px solid var(--text); border-radius:4px; display:flex; align-items:center; justify-content:center;
    transition:background .15s, border-color .15s;
  }
  .box svg { width:14px; height:14px; opacity:0; transform:scale(.6); transition:opacity .15s, transform .15s; }
  .item.done .box { background:var(--done); border-color:var(--done); }
  .item.done .box svg { opacity:1; transform:scale(1); }
  .check:focus-visible .box { outline:2px solid var(--teal); outline-offset:3px; }
  .text { padding-top:1px; min-width:0; }
  .num { color:var(--teal); font-weight:700; margin-right:6px; font-variant-numeric:tabular-nums; }
  .title { overflow-wrap:anywhere; }
  .item.done .title { color:var(--faint); text-decoration:line-through; text-decoration-thickness:1px; }
  .detail { font-size:13px; color:var(--dim); margin-top:2px; }
  .flag { font-size:12px; color:var(--warn); margin-left:6px; }
  .tools { display:flex; gap:2px; }
  .tools button {
    font:inherit; font-size:13px; color:var(--dim); background:none; border:0; padding:4px 8px; border-radius:6px; cursor:pointer;
  }
  .tools button:hover, .tools button:focus-visible { color:var(--teal); background:var(--teal-dim); outline:none; }
  @media (max-width: 520px) {
    .row { grid-template-columns:44px 1fr; }
    .tools { grid-column:2; margin:4px 0 0 -8px; }
    .addbar form { flex-wrap:wrap; }
    .addbar #addtext { order:-1; flex:1 1 100%; }
    .addbar #addbtn { margin-left:auto; }
    .wrap { padding-bottom:160px; }
  }
  .pick { position:relative; display:inline-flex; }
  .pick input[type=date] {
    position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer;
    font-size:16px; border:0; padding:0; -webkit-appearance:none; appearance:none;
  }
  .pick:focus-within button { color:var(--teal); background:var(--teal-dim); }
  .moved { margin-top:26px; font-size:14px; color:var(--dim); }
  .moved summary { cursor:pointer; padding:8px 0; color:var(--dim); }
  .moved summary:hover { color:var(--teal); }
  .moved-row { padding:6px 0 6px 12px; border-left:2px solid var(--line2); margin-left:4px; }
  .moved .flag { margin-left:6px; }
  .notes { margin:0 0 10px 44px; display:flex; flex-direction:column; gap:4px; }
  .note { font-size:14px; color:var(--dim); border-left:2px solid var(--teal); padding-left:8px; }
  .note time { color:var(--faint); font-size:12px; margin-right:6px; }
  .noteform, .editform { margin:0 0 12px 44px; display:none; gap:8px; }
  .noteform.open, .editform.open { display:flex; }
  .noteform textarea { flex:1; min-height:44px; }
  .editform { flex-direction:column; }
  .editform textarea { min-height:64px; }
  .opts { display:flex; flex-direction:column; gap:16px; }
  .opts .lab { font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--faint); margin-bottom:6px; }
  .opts .lab .cur { text-transform:none; letter-spacing:0; font-weight:400; margin-left:6px; color:var(--dim); }
  .opts .scope { align-self:flex-start; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font:inherit; font-size:13px; min-height:36px; padding:6px 12px; border-radius:999px; border:1px solid var(--line2); background:var(--surface); color:var(--text); cursor:pointer; }
  .chip:hover { border-color:var(--teal); }
  .chip[aria-pressed=true] { background:var(--teal-dim); border-color:var(--teal); color:var(--teal); font-weight:600; }
  .opts select, .opts input[type=date], .opts input[type=number] { font:inherit; font-size:16px; color:var(--text); background:var(--surface); border:1px solid var(--line2); border-radius:8px; padding:8px 10px; }
  .opts .o-cat { width:100%; }
  .opts input[type=number] { width:76px; }
  .customrow { display:none; align-items:center; gap:8px; flex-wrap:wrap; margin-top:8px; font-size:14px; color:var(--dim); }
  .customrow.show { display:flex; }
  .addopts { max-width:680px; margin:0 auto 12px; max-height:58vh; overflow-y:auto; padding:2px 2px 6px; }
  .addopts[hidden] { display:none; }
  body.opts-open .wrap { padding-bottom:75vh; }
  .addbar #moreopts { font-size:13px; padding:10px 12px; }
  .editform .row2 { display:flex; gap:8px; }
  .btn.quiet { background:transparent; color:var(--dim); border:1px solid var(--line2); }
  .btn.quiet:hover { background:var(--surface2); color:var(--text); }
  .addbar .pick button {
    font:inherit; font-size:13px; color:var(--teal); background:var(--teal-dim); border:1px solid transparent;
    border-radius:8px; padding:10px 10px; white-space:nowrap; cursor:pointer;
  }

  /* Inputs */
  textarea, input[type=text] {
    font:inherit; font-size:16px; color:var(--text); background:var(--surface); border:1px solid var(--line2);
    border-radius:8px; padding:10px 12px; resize:vertical; width:100%;
  }
  textarea:focus, input:focus { outline:2px solid var(--teal); outline-offset:0; border-color:transparent; }
  .btn {
    font:inherit; font-size:15px; font-weight:600; color:#fff; background:var(--teal); border:0; border-radius:8px;
    padding:10px 16px; cursor:pointer; white-space:nowrap;
  }
  .btn:hover { background:var(--teal-strong); }
  .btn:disabled { opacity:.5; cursor:default; }

  /* Add bar, pinned to the bottom so it's always a thumb away */
  .addbar {
    position:fixed; left:0; right:0; bottom:0; background:var(--surface); border-top:1px solid var(--line2);
    padding:10px 18px calc(10px + env(safe-area-inset-bottom));
  }
  .addbar form { max-width:680px; margin:0 auto; display:flex; gap:8px; align-items:center; }
  .scope { display:flex; border:1px solid var(--line2); border-radius:8px; overflow:hidden; flex-shrink:0; }
  .scope button { font:inherit; font-size:13px; padding:10px 10px; border:0; background:none; color:var(--dim); cursor:pointer; }
  .scope button[aria-pressed=true] { background:var(--teal-dim); color:var(--teal); font-weight:600; }

  #toast {
    position:fixed; left:50%; bottom:86px; transform:translateX(-50%); background:var(--text); color:var(--bg);
    font-size:14px; padding:9px 14px; border-radius:8px; display:none; max-width:90vw;
  }
  #toast.show { display:block; }
  .empty { padding:40px 0; color:var(--dim); }
  .empty p + p { margin-top:8px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="datenav">
      <button id="prev" aria-label="Previous day">‹ Prev</button>
      <button id="today">Today</button>
      <button id="next" aria-label="Next day">Next ›</button>
    </div>
  </div>
  <h1 id="date">Loading…</h1>
  <p class="headline" id="headline"></p>
  <p class="progress" id="progress"></p>
  <div id="fitness"></div>
  <main id="main"></main>
</div>

<div class="addbar">
  <div class="addopts" id="addopts" hidden></div>
  <form id="addform">
    <div class="scope" role="group" aria-label="Where this item goes">
      <button type="button" data-scope="business" aria-pressed="true">Business</button>
      <button type="button" data-scope="personal" aria-pressed="false">Me</button>
    </div>
    <input type="text" id="addtext" placeholder="Add an item" autocomplete="off" aria-label="New item">
    <span class="pick"><button type="button" id="adddatebtn" tabindex="-1" aria-hidden="true">Today</button><input type="date" id="adddate" aria-label="Due date for the new item (leave blank for today)"></span>
    <button class="btn quiet" id="moreopts" type="button" aria-expanded="false" aria-controls="addopts">More</button>
    <button class="btn" id="addbtn" type="submit">Add</button>
  </form>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const FN = "https://rzkrydqtgmuyeaipronh.supabase.co/functions/v1/morning-brief";
const params = new URLSearchParams(location.search);
const KEY = params.get("key") || "";
let DATE = params.get("date") || "";
let TODAY = "";
let scope = "business";
let brief = null;

const TIERS = {1:["🔴","Opportunity cost"],2:["🟠","Working on the business"],3:["🟡","High consequence"],4:["🔵","Working in the business"],5:["⚪","Maintenance"]};
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CHECK_SVG = '<svg viewBox="0 0 14 14" fill="none" aria-hidden="true"><path d="M2.5 7.5l3 3 6-7" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2600);
}
function longDate(d) {
  return new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { timeZone:"UTC", weekday:"long", month:"long", day:"numeric" });
}
function shortDate(d) {
  return d ? new Date(d + "T12:00:00Z").toLocaleDateString("en-US", { timeZone:"UTC", weekday:"short", month:"short", day:"numeric" }) : "a later day";
}
function shiftDate(d, n) { const x = new Date(d + "T12:00:00Z"); x.setUTCDate(x.getUTCDate() + n); return x.toISOString().slice(0,10); }
function fmtNoteTime(iso) { return new Date(iso).toLocaleTimeString("en-US", { hour:"numeric", minute:"2-digit" }); }

async function api(method, body) {
  const u = `${FN}?key=${encodeURIComponent(KEY)}` + (method === "GET" ? `&date=${DATE}` : "");
  const res = await fetch(u, method === "GET" ? {} : {
    method, headers: { "Content-Type":"application/json" }, body: JSON.stringify({ date: DATE, ...body })
  });
  const data = await res.json().catch(() => ({}));
  return { ok: res.ok, status: res.status, data };
}

// ── Workout & walk log: a personal daily record, kept separate from the ──
// task list's render() so filling it in is never interrupted by a task
// check-off elsewhere on the page.
const FIT_SLOTS = 7;
let fitness = null;
const emptyFitness = () => ({
  workout: Array.from({ length: FIT_SLOTS }, () => ({ exercise: "", reps: "", weight: "", time: "" })),
  summary: { time: "", calories: "", hr: "" }, walk: { distance: "", time: "", hr: "" }, updated_at: "",
});
function padFitness(f) {
  const base = emptyFitness();
  if (!f) return base;
  const workout = (f.workout || []).slice(0, FIT_SLOTS).map((s, i) => ({ ...base.workout[i], ...s }));
  while (workout.length < FIT_SLOTS) workout.push({ ...base.workout[workout.length] });
  return {
    workout, summary: { ...base.summary, ...(f.summary || {}) }, walk: { ...base.walk, ...(f.walk || {}) },
    updated_at: f.updated_at || "",
  };
}
// Fills only BLANK boxes with the morning's suggestion — never touches
// anything already typed, and never applies once today's log is saved.
function applySuggestion(f, suggestion, isToday) {
  if (!suggestion || !isToday || f.updated_at) return f;
  const workout = f.workout.map((slot, i) => {
    const s = suggestion.workout && suggestion.workout[i];
    if (slot.exercise.trim() || !s || !s.exercise) return slot;
    return { exercise: s.exercise || "", reps: s.reps || "", weight: s.weight || "", time: s.time || "" };
  });
  const sw = suggestion.walk || {};
  const walk = { distance: f.walk.distance || sw.distance || "", time: f.walk.time || sw.time || "", hr: f.walk.hr || sw.hr || "" };
  return { ...f, workout, walk, _suggested: true, _note: suggestion.note || "" };
}

function renderFitness() {
  const f = fitness || emptyFitness();
  const rows = f.workout.map((s, i) => `
    <div class="fitrow" data-slot="${i}">
      <input class="fit-ex" placeholder="Exercise ${i + 1}" value="${esc(s.exercise)}" aria-label="Exercise ${i + 1} name">
      <div class="fit-sub">
        <input class="fit-num" type="number" inputmode="numeric" placeholder="Reps" value="${esc(s.reps)}" aria-label="Exercise ${i + 1} reps">
        <input class="fit-num" type="number" inputmode="decimal" step="0.5" placeholder="Weight (lb)" value="${esc(s.weight)}" aria-label="Exercise ${i + 1} weight in pounds">
        <input class="fit-time" type="text" placeholder="mm:ss" value="${esc(s.time)}" aria-label="Exercise ${i + 1} time (minutes:seconds)">
      </div>
    </div>`).join("");
  const saved = f.updated_at ? `<span class="fit-saved">Saved ${fmtNoteTime(f.updated_at)}</span>` : `<span class="fit-saved">Not saved yet</span>`;
  const doneCount = f.workout.filter((s) => s.exercise.trim()).length;
  const summary = doneCount ? `${doneCount} exercise${doneCount === 1 ? "" : "s"} logged` : "Log today's workout";
  const noteHTML = f._suggested && f._note ? `<div class="fit-note">${esc(f._note)}</div>` : "";
  const wasOpen = document.querySelector("#fitness .fitcard")?.open;
  const openNow = wasOpen ?? !!f._suggested;
  $("#fitness").innerHTML = `
    <h2>Workout &amp; walk</h2>
    <details class="fitcard">
      <summary><span><span class="chev">\u203a</span> ${esc(summary)}</span>${saved}</summary>
      <div class="fitbody">
        ${noteHTML}
        ${rows}
        <div class="fitrow" data-summary="1">
          <div class="fit-ex" style="font-weight:600;color:var(--dim)">Workout totals <span class="fit-goal"></span></div>
          <div class="fit-sub">
            <input class="fit-time" type="text" placeholder="mm:ss" value="${esc(f.summary.time)}" aria-label="Total workout time (minutes:seconds)">
            <input class="fit-num" type="number" inputmode="numeric" placeholder="Calories" value="${esc(f.summary.calories)}" aria-label="Calories burned">
            <input class="fit-num" type="number" inputmode="numeric" placeholder="Avg HR" value="${esc(f.summary.hr)}" aria-label="Workout average heart rate">
          </div>
        </div>
        <div class="fitrow" data-walk="1">
          <div class="fit-ex" style="font-weight:600;color:var(--dim)">Walk</div>
          <div class="fit-sub">
            <input class="fit-num" type="number" inputmode="decimal" step="0.1" placeholder="Miles" value="${esc(f.walk.distance)}" aria-label="Walk distance in miles">
            <input class="fit-time" type="text" placeholder="mm:ss" value="${esc(f.walk.time)}" aria-label="Walk time (minutes:seconds)">
            <input class="fit-num" type="number" inputmode="numeric" placeholder="Avg HR" value="${esc(f.walk.hr)}" aria-label="Walk average heart rate">
          </div>
        </div>
        <div class="fit-foot"><span></span><button class="btn" id="fitsave" type="button">Save log</button></div>
      </div>
    </details>`;
  document.querySelector("#fitness .fitcard").open = openNow;
  updateWorkoutGoalBadge();
}
// Goal is 15 min of exercise a day. Parses the Workout totals time (mm:ss)
// and shows a quiet checkmark once it's hit — no indicator otherwise, so a
// short day never reads as a scolding.
const WORKOUT_GOAL_SECONDS = 15 * 60;
function parseMMSS(v) {
  const m = String(v || "").trim().match(/^(\d+):([0-5]\d)$/);
  return m ? (+m[1]) * 60 + (+m[2]) : null;
}
function updateWorkoutGoalBadge() {
  const badge = document.querySelector("#fitness .fit-goal");
  const input = document.querySelector('#fitness .fitrow[data-summary] .fit-time');
  if (!badge || !input) return;
  const secs = parseMMSS(input.value);
  badge.textContent = secs !== null && secs >= WORKOUT_GOAL_SECONDS ? "\u2713 15 min goal met" : "";
}
function readFitness() {
  const rows = [...document.querySelectorAll('#fitness .fitrow[data-slot]')];
  const workout = rows.map((r) => ({
    exercise: r.querySelector(".fit-ex").value, reps: r.querySelectorAll(".fit-num")[0].value,
    weight: r.querySelectorAll(".fit-num")[1].value, time: r.querySelector(".fit-time").value,
  }));
  const s = document.querySelector('#fitness .fitrow[data-summary]');
  const summary = { time: s.querySelector(".fit-time").value, calories: s.querySelectorAll(".fit-num")[0].value, hr: s.querySelectorAll(".fit-num")[1].value };
  const w = document.querySelector('#fitness .fitrow[data-walk]');
  const walk = { distance: w.querySelectorAll(".fit-num")[0].value, time: w.querySelector(".fit-time").value, hr: w.querySelectorAll(".fit-num")[1].value };
  return { workout, summary, walk };
}
document.addEventListener("input", (e) => {
  if (e.target.closest('#fitness .fitrow[data-summary] .fit-time')) updateWorkoutGoalBadge();
});
document.addEventListener("click", async (e) => {
  if (e.target.id !== "fitsave") return;
  const body = readFitness(); e.target.disabled = true;
  const r = await api("POST", { action: "save_fitness", ...body });
  e.target.disabled = false;
  if (r.ok) { fitness = { ...body, updated_at: r.data.updated_at }; renderFitness(); toast("Workout log saved"); }
  else toast(r.data.error || "Couldn't save the log.");
});

async function load() {
  if (!KEY) { $("#date").textContent = "Missing key"; $("#main").innerHTML = '<div class="empty"><p>Open this page from the link or QR code in your morning email.</p></div>'; return; }
  const { ok, status, data } = await api("GET");
  TODAY = data.today || TODAY;
  if (!DATE) DATE = TODAY;
  history.replaceState(null, "", `?key=${encodeURIComponent(KEY)}&date=${DATE}`);
  $("#date").textContent = longDate(DATE);
  $("#adddate").min = DATE;
  if (TODAY && !addRoot()) buildAddOpts();
  $("#next").disabled = DATE >= TODAY;
  if (status === 401) { $("#main").innerHTML = '<div class="empty"><p>This link\'s key isn\'t valid anymore. Use the link in your latest morning email.</p></div>'; return; }
  if (!ok) {
    brief = null; $("#headline").textContent = ""; $("#progress").textContent = "";
    $("#main").innerHTML = `<div class="empty"><p>No brief for ${esc(longDate(DATE))}.</p><p>${DATE === TODAY ? "It's built at 5:30 each morning. Anything you add below still lands in your priorities." : "Briefs only exist for days the email went out."}</p></div>`;
    fitness = padFitness(data.fitness); renderFitness();
    return;
  }
  brief = data.brief;
  fitness = applySuggestion(padFitness(data.fitness), brief?.fitness_suggestion, DATE === TODAY);
  render();
  renderFitness();
}

function itemHTML(it) {
  const notes = (it.notes || []).map(n => `<div class="note"><time>${fmtNoteTime(n.at)}</time>${esc(n.text)}</div>`).join("");
  const movedLabel = it.moved_to === shiftDate(TODAY, 1) ? "tomorrow" : shortDate(it.moved_to);
  const flag = it.missing ? '<span class="flag">removed from brain</span>'
    : it.pushed ? `<span class="flag">${it.added ? "due" : "moved to"} ${esc(movedLabel)}</span>` : "";
  return `<div class="item${it.done ? " done" : ""}" data-id="${it.id}">
    <div class="row">
      <button class="check" aria-pressed="${it.done}" aria-label="${it.done ? "Uncheck" : "Check off"} item ${it.n}"><span class="box">${CHECK_SVG}</span></button>
      <div class="text">
        <span class="num">${it.n}.</span><span class="title">${esc(it.title)}${it.recurring ? " ⟳" : ""}</span>${flag}
        ${it.detail ? `<div class="detail">${esc(it.detail)}</div>` : ""}
      </div>
      <div class="tools">
        <button data-act="edit" aria-label="Edit item ${it.n}">Edit</button>
        <button data-act="note" aria-label="Add a note to item ${it.n}">Note</button>
        ${it.done || it.pushed ? "" : `<button data-act="push" aria-label="Move item ${it.n} to tomorrow">Tomorrow</button>
        <span class="pick"><button tabindex="-1" aria-hidden="true">Pick day</button><input type="date" class="pickdate" min="${shiftDate(TODAY, 1)}" aria-label="Pick a day to move item ${it.n} to"></span>`}
      </div>
    </div>
    ${notes ? `<div class="notes">${notes}</div>` : ""}
    <form class="editform"><textarea rows="3" aria-label="Edit item ${it.n}">${esc(it.full_text || it.title)}</textarea>
      <div class="optsmount"></div>
      <div class="row2"><button class="btn" type="submit">Save</button><button class="btn quiet" type="button" data-act="cancel-edit">Cancel</button></div></form>
    <form class="noteform"><textarea rows="2" placeholder="What happened?" aria-label="Note for item ${it.n}"></textarea><button class="btn" type="submit">Save note</button></form>
  </div>`;
}

function render() {
  const b = brief;
  $("#headline").textContent = b.headline || "";
  // Items given a later date leave today's list (they're collected at the bottom)
  const today = b.items.filter(i => !i.pushed);
  const moved = b.items.filter(i => i.pushed);
  const done = today.filter(i => i.done).length;
  $("#progress").innerHTML = today.length ? `<b>${done}</b> of ${today.length} done` : "";

  const sched = b.appointments.length
    ? `<div class="sched">${b.appointments.map(a => `<span class="t">${esc(a.time)}</span><span>${esc(a.title)}${a.location ? ` <span class="loc">(${esc(a.location)})</span>` : ""}</span>`).join("")}</div>`
    : `<p class="muted">${b.calendar_ok ? "Nothing on the calendar." : "The calendar didn't load this morning."}</p>`;

  const tasks = today.filter(i => i.section === "task" && !i.added);
  const tierHTML = [1,2,3,4,5].map(t => {
    const its = tasks.filter(i => i.tier === t);
    return its.length ? `<h3>${TIERS[t][0]} ${TIERS[t][1]}</h3>${its.map(itemHTML).join("")}` : "";
  }).join("");
  const clients = today.filter(i => i.section === "client");
  const added = today.filter(i => i.added);
  const movedHTML = moved.length ? `<details class="moved"><summary>${moved.length} scheduled for later day${moved.length === 1 ? "" : "s"}</summary>
    ${moved.map(i => `<div class="moved-row"><span class="num">${i.n}.</span>${esc(i.title)} <span class="flag">${esc(shortDate(i.moved_to))}</span></div>`).join("")}</details>` : "";

  $("#main").innerHTML = `
    <h2>Today's schedule</h2>${sched}
    <h2>To do</h2>${tierHTML || '<p class="muted">Nothing pressing on the list.</p>'}
    ${clients.length ? `<h2>Client follow-ups from dids</h2>${clients.map(itemHTML).join("")}` : (b.dids_ok ? "" : '<h2>Client follow-ups from dids</h2><p class="muted">Dids data didn\'t load this morning.</p>')}
    ${added.length ? `<h2>Added today</h2>${added.map(itemHTML).join("")}` : ""}
    ${movedHTML}`;
}

// ── Options: the same fields as capture.html ───────────────────
const CATS = [["","Default (uncategorized)"],["important","⭐ Important"],["finance","Finance"],["marketing","Marketing"],["operations","Operations"],["process","Process"],["recruiting","Recruiting"],["retention","Retention"],["technical","Technical"],["automation","Automation"],["health","Health"],["home","Home"]];
const REPEATS = [["none","None"],["daily","Daily"],["weekly","Weekly"],["biweekly","Biweekly"],["monthly","Monthly"],["custom","Custom…"]];
const TIER_CHIPS = [[1,"T1 Opportunity"],[2,"T2 Strategy"],[3,"T3 Consequence"],[4,"T4 Operations"],[5,"T5 Maintenance"]];
const DOW = ["Su","M","Tu","W","Th","F","Sa"];

function addMonthStr(d, n) {
  const x = new Date(d + "T12:00:00Z"); const day = x.getUTCDate();
  x.setUTCDate(1); x.setUTCMonth(x.getUTCMonth() + n);
  const last = new Date(Date.UTC(x.getUTCFullYear(), x.getUTCMonth() + 1, 0)).getUTCDate();
  x.setUTCDate(Math.min(day, last)); return x.toISOString().slice(0, 10);
}
function whenChips() {
  const chips = [];
  for (let i = 0; i <= 6; i++) {
    const d = shiftDate(TODAY, i);
    chips.push({ label: i === 0 ? "Today" : DOW[new Date(d + "T12:00:00Z").getUTCDay()], val: d, today: i === 0 });
  }
  chips.push({ label: "2wk", val: shiftDate(TODAY, 14) }, { label: "1mo", val: addMonthStr(TODAY, 1) }, { label: "Custom…", val: "custom" });
  return chips;
}
// Repeat values are stored as a word ("weekly") or { every, unit }; read either.
function normRepeat(r) {
  if (!r) return { key: "none" };
  const unitOf = (u) => /day/.test(u) ? "days" : /month/.test(u) ? "months" : /year|annual/.test(u) ? "years" : "weeks";
  if (typeof r === "object") return { key: "custom", n: Math.max(1, Number(r.every) || 1), unit: unitOf(String(r.unit || "weeks").toLowerCase()) };
  const w = String(r).toLowerCase();
  if (["daily", "weekly", "biweekly", "monthly"].includes(w)) return { key: w };
  if (/quarter/.test(w)) return { key: "custom", n: 3, unit: "months" };
  if (/semi/.test(w)) return { key: "custom", n: 6, unit: "months" };
  return { key: "custom", n: 1, unit: unitOf(w) };
}
function repeatKey(r) { const n = normRepeat(r); return n.key === "custom" ? `c:${n.n}:${n.unit}` : n.key; }
const chipHTML = (attr, val, label, extra = "") =>
  `<button type="button" class="chip${extra}" data-${attr}="${esc(val)}" aria-pressed="false">${esc(label)}</button>`;

function optsHTML(kind, o) {
  o = o || {};
  const cur = kind === "edit" && o.due_date ? `<span class="cur">currently ${esc(shortDate(o.due_date))}</span>` : "";
  const when = (kind === "edit" ? chipHTML("when", "none", "None") : "") +
    whenChips().map(c => chipHTML("when", c.val, c.label, c.today ? " today" : "")).join("");
  const who = kind === "edit" ? `<div class="scope" role="group" aria-label="Business or me">
      <button type="button" data-scope="business" aria-pressed="${o.scope !== "personal"}">Business</button>
      <button type="button" data-scope="personal" aria-pressed="${o.scope === "personal"}">Me</button></div>` : "";
  return `<div class="opts" data-kind="${kind}">${who}
    <div><div class="lab">When?${cur}</div><div class="chips">${when}</div>
      <div class="customrow o-customwhen"><input type="date" class="o-date" min="${TODAY}" aria-label="Custom date"></div></div>
    <div><div class="lab">Repeats?</div><div class="chips">${REPEATS.map(([v, l]) => chipHTML("repeat", v, l)).join("")}</div>
      <div class="customrow o-customrepeat">Every <input type="number" class="o-n" min="1" max="365" value="2" aria-label="Repeat every">
        <select class="o-unit" aria-label="Repeat unit"><option value="days">days</option><option value="weeks" selected>weeks</option><option value="months">months</option><option value="years">years</option></select></div></div>
    <div><div class="lab">Priority (auto unless you pick one)</div><div class="chips">${TIER_CHIPS.map(([v, l]) => chipHTML("tier", v, l)).join("")}</div></div>
    <div><div class="lab">Category</div><select class="o-cat" aria-label="Category">${CATS.map(([v, l]) => `<option value="${v}">${esc(l)}</option>`).join("")}</select></div>
  </div>`;
}
function applyWhen(root, val) {
  const btns = [...root.querySelectorAll("[data-when]")];
  const hit = val && val !== "custom" ? btns.find(b => b.dataset.when === val) : null;
  const custom = btns.find(b => b.dataset.when === "custom");
  const showCustom = !hit && !!val;
  btns.forEach(b => b.setAttribute("aria-pressed", String(b === hit || (showCustom && b === custom))));
  const row = root.querySelector(".o-customwhen"), inp = row.querySelector(".o-date");
  row.classList.toggle("show", showCustom);
  if (showCustom) { if (val !== "custom") inp.value = val; else if (!inp.value) inp.value = TODAY; }
}
function initOpts(root, kind, o) {
  o = o || {};
  const rep = normRepeat(o.repeat);
  root._orig = { repeatKey: repeatKey(o.repeat), tier: o.tier_override ?? null, category: o.category || "" };
  root.querySelector(`[data-repeat="${rep.key}"]`).setAttribute("aria-pressed", "true");
  if (rep.key === "custom") {
    root.querySelector(".o-customrepeat").classList.add("show");
    root.querySelector(".o-n").value = rep.n; root.querySelector(".o-unit").value = rep.unit;
  }
  if (o.tier_override) root.querySelector(`[data-tier="${o.tier_override}"]`)?.setAttribute("aria-pressed", "true");
  const sel = root.querySelector(".o-cat");
  if (o.category && !CATS.some(([v]) => v === o.category)) sel.insertAdjacentHTML("beforeend", `<option value="${esc(o.category)}">${esc(o.category)} (internal)</option>`);
  sel.value = o.category || "";
  if (kind === "add") applyWhen(root, TODAY);   // blank date always means today
}
function readOpts(root) {
  const q = (s) => root.querySelector(s);
  const wb = q('[data-when][aria-pressed="true"]');
  let due;                                     // undefined = nothing chosen
  if (wb) { const v = wb.dataset.when; due = v === "none" ? "" : v === "custom" ? (q(".o-date").value || undefined) : v; }
  const rb = q('[data-repeat][aria-pressed="true"]')?.dataset.repeat || "none";
  let repeat = null;
  if (rb === "custom") repeat = { every: Math.max(1, Math.min(365, parseInt(q(".o-n").value) || 1)), unit: q(".o-unit").value };
  else if (rb !== "none") repeat = rb;
  const tb = q('[data-tier][aria-pressed="true"]');
  return { scope: q('[data-scope][aria-pressed="true"]')?.dataset.scope || null, due, repeat, tier: tb ? Number(tb.dataset.tier) : null, category: q(".o-cat").value };
}
const addRoot = () => document.querySelector("#addopts .opts");
function syncAddBar() {              // keep the bottom bar's date button in step with the When chips
  const r = addRoot(); if (!r) return;
  const due = readOpts(r).due, later = due && due !== TODAY;
  $("#adddate").value = later ? due : "";
  $("#adddatebtn").textContent = later ? shortDate(due).replace(/^\w+, /, "") : "Today";
}
function buildAddOpts() {
  const box = $("#addopts"); box.innerHTML = optsHTML("add");
  initOpts(box.querySelector(".opts"), "add"); syncAddBar();
}
document.addEventListener("click", (e) => {
  const b = e.target.closest(".opts button"); if (!b) return;
  const root = b.closest(".opts"), kind = root.dataset.kind;
  if (b.dataset.scope) {
    root.querySelectorAll("[data-scope]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  } else if (b.dataset.when !== undefined) {
    const same = b.getAttribute("aria-pressed") === "true";
    applyWhen(root, same && kind === "edit" ? "" : b.dataset.when);   // tap again on an edit to leave the date alone
    if (kind === "add") syncAddBar();
  } else if (b.dataset.repeat) {
    root.querySelectorAll("[data-repeat]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    root.querySelector(".o-customrepeat").classList.toggle("show", b.dataset.repeat === "custom");
  } else if (b.dataset.tier) {
    const on = b.getAttribute("aria-pressed") === "true";
    root.querySelectorAll("[data-tier]").forEach(x => x.setAttribute("aria-pressed", String(!on && x === b)));   // tap again = auto
  }
});
document.addEventListener("change", (e) => {
  const inp = e.target.closest && e.target.closest(".o-date"); if (!inp) return;
  const root = inp.closest(".opts");
  if (inp.value && inp.value < TODAY) { toast("Pick today or a later day."); inp.value = ""; return; }
  if (inp.value) {
    root.querySelectorAll("[data-when]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.when === "custom")));
    if (root.dataset.kind === "add") syncAddBar();
  }
});

// Check / note / push
$("#main").addEventListener("click", async (e) => {
  const el = e.target.closest(".item"); if (!el) return;
  const id = el.dataset.id; const it = brief.items.find(i => i.id === id);

  if (e.target.closest(".check")) {
    const next = !it.done; it.done = next; render();
    const r = await api("POST", { action: next ? "check" : "uncheck", id });
    if (!r.ok) { it.done = !next; render(); toast(r.data.error || "Couldn't save. Try again."); }
    return;
  }
  const act = e.target.closest("[data-act]")?.dataset.act;
  if (act === "edit") {
    const f = el.querySelector(".editform"); f.classList.toggle("open");
    if (f.classList.contains("open")) {
      const mount = f.querySelector(".optsmount");
      if (!mount.firstElementChild) { mount.innerHTML = optsHTML("edit", it); initOpts(mount.querySelector(".opts"), "edit", it); }
      const ta = f.querySelector("textarea"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length);
    }
  }
  if (act === "cancel-edit") { el.querySelector(".editform").classList.remove("open"); }
  if (act === "note") {
    const f = el.querySelector(".noteform"); f.classList.toggle("open");
    if (f.classList.contains("open")) f.querySelector("textarea").focus();
  }
  if (act === "push") {
    await moveTo(it, shiftDate(TODAY, 1));
  }
});

async function moveTo(it, to) {
  const r = await api("POST", { action: "push", id: it.id, to });
  if (r.ok) {
    it.pushed = true; it.moved_to = to; render();
    toast(`Item ${it.n} moved to ${to === shiftDate(TODAY, 1) ? "tomorrow" : shortDate(to)}`);
  } else toast(r.data.error || "Couldn't move it. Try again.");
}

// Pick day: a transparent date input sits over the button, so tapping opens
// the phone's own calendar. On desktop, open the picker explicitly.
$("#main").addEventListener("click", (e) => {
  const input = e.target.closest(".pickdate");
  if (input && typeof input.showPicker === "function") { try { input.showPicker(); } catch {} }
});
$("#main").addEventListener("change", async (e) => {
  const input = e.target.closest(".pickdate"); if (!input || !input.value) return;
  const it = brief.items.find(i => i.id === input.closest(".item").dataset.id);
  if (input.value <= TODAY) { toast("Pick a day after today."); input.value = ""; return; }
  await moveTo(it, input.value);
});

$("#main").addEventListener("submit", async (e) => {
  if (e.target.classList.contains("editform")) {
    e.preventDefault();
    const el = e.target.closest(".item"); const it = brief.items.find(i => i.id === el.dataset.id);
    const content = e.target.querySelector("textarea").value.trim(); if (!content) return;
    const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true;
    const root = e.target.querySelector(".opts");
    const body = { action: "edit", id: it.id, content };
    if (root) {
      const o = readOpts(root), orig = root._orig;
      body.scope = o.scope || it.scope || "business";
      if (o.due !== undefined) body.due = o.due;                                        // "" clears the date
      if (repeatKey(o.repeat) !== orig.repeatKey) body.recurring = o.repeat;            // null clears the repeat
      if ((o.tier ?? null) !== orig.tier) body.tier = o.tier;                           // null goes back to auto
      if (o.category !== orig.category) body.category = o.category;
    }
    const r = await api("POST", body);
    btn.disabled = false;
    if (r.ok) {
      const d = r.data;
      it.title = d.title || content; it.full_text = content; it.scope = d.scope || it.scope;
      if ("due_date" in d) { it.due_date = d.due_date; it.pushed = !it.done && !!d.due_date && d.due_date > DATE; it.moved_to = it.pushed ? d.due_date : undefined; }
      if ("repeat" in d) { it.repeat = d.repeat; it.recurring = !!d.repeat; }
      if ("tier_override" in d) { it.tier_override = d.tier_override; it.tier = d.tier_override || it.tier_auto || it.tier; }
      if ("category" in d) it.category = d.category;
      render();
      toast(`Item ${it.n} updated${it.pushed ? ` · scheduled for ${shortDate(it.moved_to)}` : ""}`);
    }
    else toast(r.data.error || "Couldn't save the change.");
    return;
  }
  if (!e.target.classList.contains("noteform")) return;
  e.preventDefault();
  const el = e.target.closest(".item"); const it = brief.items.find(i => i.id === el.dataset.id);
  const ta = e.target.querySelector("textarea"); const text = ta.value.trim(); if (!text) return;
  const btn = e.target.querySelector("button"); btn.disabled = true;
  const r = await api("POST", { action: "note", id: it.id, text });
  btn.disabled = false;
  if (r.ok) { it.notes = [...(it.notes || []), { at: new Date().toISOString(), text }]; render(); toast("Note saved"); }
  else toast(r.data.error || "Couldn't save the note.");
});

// Add
document.querySelectorAll(".scope button").forEach(b => b.addEventListener("click", () => {
  scope = b.dataset.scope;
  document.querySelectorAll(".scope button").forEach(x => x.setAttribute("aria-pressed", x === b));
}));
$("#addform").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = $("#addtext"); const content = input.value.trim(); if (!content) return;
  $("#addbtn").disabled = true;
  const root = addRoot(); const o = root ? readOpts(root) : {};
  const due = o.due || $("#adddate").value || "";
  const body = { action: "add", content, scope, due };
  if (o.repeat) body.recurring = o.repeat;
  if (o.tier) body.tier = o.tier;
  if (o.category) body.category = o.category;
  const r = await api("POST", body);
  $("#addbtn").disabled = false;
  if (r.ok) {
    input.value = ""; buildAddOpts();
    toast((due && due !== TODAY ? `Added, due ${shortDate(due)}` : "Added for today") + (o.repeat ? " · repeats" : "")); await load();
  }
  else toast(r.data.error || "Couldn't add it. Try again.");
});

// Due date for new items: blank means the brief's day
$("#adddate").addEventListener("click", (e) => { if (typeof e.target.showPicker === "function") { try { e.target.showPicker(); } catch {} } });
$("#adddate").addEventListener("change", (e) => {
  const v = e.target.value;
  if (v && v < (DATE || TODAY)) { toast("Pick today or a later day."); e.target.value = ""; }
  const val = e.target.value, r = addRoot();
  if (r) applyWhen(r, val || TODAY);
  $("#adddatebtn").textContent = val && val !== TODAY ? shortDate(val).replace(/^\w+, /, "") : "Today";
});

// More options for the new item
$("#moreopts").addEventListener("click", () => {
  const box = $("#addopts"), open = box.hidden;
  box.hidden = !open;
  $("#moreopts").setAttribute("aria-expanded", String(open)); $("#moreopts").textContent = open ? "Less" : "More";
  document.body.classList.toggle("opts-open", open);
});

// Date navigation
$("#prev").onclick = () => { DATE = shiftDate(DATE || TODAY, -1); load(); };
$("#next").onclick = () => { if (DATE < TODAY) { DATE = shiftDate(DATE, 1); load(); } };
$("#today").onclick = () => { DATE = TODAY; load(); };

load();
</script>
</body>
</html>
